# Use together with docker-compose.yml after configuring DNS and freeing port 80.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - website
      - cms
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,Z
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
